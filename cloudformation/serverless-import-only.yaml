AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  client-timesheet-app serverless stack - IMPORT-ONLY template. Contains just the three
  DynamoDB tables so the existing (Terraform-created) tables can be adopted with an
  IMPORT change set. After the import, deploy serverless.yaml to add all other resources.
  Table definitions MUST stay identical to serverless.yaml.

Parameters:
  Environment:
    Type: String
    Default: production
    Description: Environment name
  AppName:
    Type: String
    Default: client-timesheet-app
    Description: Application name (used as resource-name prefix and Project tag)

Resources:
  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AppName}-users"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      Tags:
        - Key: Name
          Value: Users Table
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref AppName
        - Key: ManagedBy
          Value: cloudformation

  ClientsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AppName}-clients"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: user_email
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user_email-index
          KeySchema:
            - AttributeName: user_email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Name
          Value: Clients Table
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref AppName
        - Key: ManagedBy
          Value: cloudformation

  WorkEntriesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AppName}-work-entries"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: user_email
          AttributeType: S
        - AttributeName: client_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user_email-index
          KeySchema:
            - AttributeName: user_email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: client_id-index
          KeySchema:
            - AttributeName: client_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Name
          Value: Work Entries Table
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref AppName
        - Key: ManagedBy
          Value: cloudformation
